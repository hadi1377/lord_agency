services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lord_agency_frontend
    ports:
      - "4000:4000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true

